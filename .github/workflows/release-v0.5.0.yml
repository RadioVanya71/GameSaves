name: Publish GameSaves v0.5.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v0.5.0.yml']
  workflow_dispatch:

permissions: {}
concurrency: stable-v0.5.0

jobs:
  publish:
    if: github.repository == 'RadioVanya71/GameSaves' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verify and publish the v0.5.0 Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: RadioVanya71/GameSaves
        shell: bash
        run: |
          set -euo pipefail
          sha=412831ceda951e18d7df651800fd7b5f008a0c41
          run=45958057592
          artifact=15179234804
          asset=GameSaves-v0.5.0-windows-x64.zip
          gh api "repos/$GH_REPO/actions/runs/$run" | jq -e --arg sha "$sha" '.conclusion == "success" and .head_branch == "main" and .head_sha == $sha'
          gh api "repos/$GH_REPO/actions/artifacts/$artifact" | jq -e --argjson run "$run" '.workflow_run.id == $run and .name == "GameSaves-windows-x64" and (.expired | not)'
          gh api "repos/$GH_REPO/actions/artifacts/$artifact/zip" > "$asset"
          echo "04caf3c36ce499a2e603e991ac8fd0d31ce18b2726aae3aa6a153113535ab3a1  $asset" | sha256sum -c -
          unzip -t "$asset"
          gh release create v0.5.0 "$asset" --target "$sha" --title "GameSaves 0.5.0" --notes "Обмен сохранениями между друзьями, библиотека игр с обложками и восстановление выбранной версии. Для Windows x64 скачайте ZIP, распакуйте его и запустите game-saves.exe." --latest
