name: Windows demo build

on:
  push:
    branches: [demo]
    paths:
      - '.github/workflows/windows.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust 1.100.0
        shell: pwsh
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Run tests
        shell: pwsh
        run: cargo +1.100.0 test --locked
      - name: Build application
        shell: pwsh
        run: cargo +1.100.0 build --locked --release
      - name: Bundle Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item target/release/game-saves.exe, README.md, src/fonts/OpenSans-LICENSE.txt -Destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: GameSaves-demo-windows-x64
          path: dist/
          if-no-files-found: error
