name: Windows build

on:
  push:
    branches: [main, release-0.7]
    paths:
      - '.github/workflows/windows.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'README.md'
      - 'RELEASE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust 1.100.0
        shell: pwsh
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Run tests
        shell: pwsh
        run: cargo +1.100.0 test --locked
      - name: Build application
        env:
          GAMESAVES_GOOGLE_CLIENT_ID: ${{ vars.GAMESAVES_GOOGLE_CLIENT_ID }}
          GAMESAVES_GOOGLE_CLIENT_SECRET: ${{ secrets.GAMESAVES_GOOGLE_CLIENT_SECRET }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -eq 'refs/heads/main' -and (git log -1 --format=%s) -like 'Release GameSaves *') {
            if ($env:GAMESAVES_GOOGLE_CLIENT_ID -notmatch '^[a-zA-Z0-9_-]+\.apps\.googleusercontent\.com$' -or
                [string]::IsNullOrWhiteSpace($env:GAMESAVES_GOOGLE_CLIENT_SECRET)) {
              throw 'Public release requires the GameSaves Google Desktop OAuth client in GitHub Actions settings.'
            }
          }
          cargo +1.100.0 build --locked --release
      - name: Bundle Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item target/release/game-saves.exe, README.md, src/fonts/OpenSans-LICENSE.txt -Destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: GameSaves-windows-x64
          path: dist/
          if-no-files-found: error

  release:
    name: Publish tested Windows ZIP
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release GameSaves ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: GameSaves-windows-x64
          path: dist
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git log -1 --format=%s)" == "Release GameSaves $version for Windows" ]]
          asset="GameSaves-v$version-windows-x64.zip"
          (cd dist && zip -q "../$asset" game-saves.exe README.md OpenSans-LICENSE.txt)
          unzip -t "$asset"
          gh release create "v$version" "$asset" --target "$GITHUB_SHA" --title "GameSaves $version" --notes-file RELEASE.md --latest
