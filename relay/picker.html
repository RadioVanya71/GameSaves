<!doctype html><html lang="ru"><meta charset="utf-8"><title>GameSaves · Создать группу</title>
<style>body{font:18px system-ui;margin:8vh auto;padding:24px;max-width:650px;color:#18243a}button,input{font:inherit;padding:12px}input{width:95%}</style>
<h1>Создать группу</h1><p id="message">Введи код подключения из своего окна GameSaves и выбери ту же папку на Google Диске.</p>
<label>Код своего устройства <input id="proof" maxlength="12" autocomplete="off"></label><button id="choose" disabled>Выбрать папку</button><input id="invite" readonly hidden aria-label="Приглашение в группу">
<script src="https://apis.google.com/js/api.js"></script><script>
const [app,key,token]=/*CONFIG*/;
gapi.load('picker',()=>choose.disabled=false);
choose.onclick=()=>new google.picker.PickerBuilder().setAppId(app).setDeveloperKey(key).setOAuthToken(token)
.addView(new google.picker.DocsView(google.picker.ViewId.FOLDERS).setIncludeFolders(true).setSelectFolderEnabled(true))
.setCallback(async result=>{
 if(result.action!==google.picker.Action.PICKED)return;
 choose.disabled=true;
 try {
 const r=await fetch('/folder',{method:'POST',body:JSON.stringify({folder:result.docs[0].id,proof:proof.value.trim()})});
 if(!r.ok)throw Error();
 choose.hidden=true;proof.hidden=true;
 message.textContent='Папка подключена. Вернись в GameSaves. Отправь друзьям обычную ссылку на папку и подтверди их заявки.';
 }catch{message.textContent='Не удалось подключить папку. Проверь право добавлять файлы и попробуй ещё раз.';choose.disabled=false;}
}).build().setVisible(true);
</script></html>
