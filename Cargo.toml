[package]
name = "game-saves"
version = "0.5.0-demo.1"
edition = "2024"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steamlocate = "2.1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
zip = { version = "4.6", default-features = false }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
winreg = "0.55"
