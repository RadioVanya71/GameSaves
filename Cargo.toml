[package]
name = "game-saves"
version = "0.7.2"
edition = "2024"

[dependencies]
base64 = "0.22"
ring = "0.17"
webbrowser = "1.2"
url = "2.5"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steamlocate = "2.1"
tempfile = "3"
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
zip = { version = "4.6", default-features = false }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
winreg = "0.55"

windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
